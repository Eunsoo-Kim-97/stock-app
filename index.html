<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모의투자</title>
<meta name="description" content="듀얼 모멘텀 모의투자 계좌 현황">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<style>
  /* 색깔: 한국 증시처럼 오르면 빨강, 내리면 파랑 */
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #191c21; --sub: #6b7280; --line: #e6e8eb;
    --up: #e5383b; --down: #2563eb; --flat: #8b929c; --accent: #191c21;
    --bench1: #9aa1ab; --bench2: #c3c8cf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171b22; --text: #eef0f3; --sub: #9aa3ae; --line: #262c35;
      --up: #ff5a5f; --down: #4f8dff; --flat: #8b929c; --accent: #eef0f3;
      --bench1: #6f7782; --bench2: #4a515b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .num { font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }

  header { padding: 12px 4px 20px; }
  .label { font-size: 14px; color: var(--sub); }
  .total { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 6px; }
  .change { font-size: 16px; font-weight: 600; }
  .meta { margin-top: 10px; font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .refresh { font: inherit; font-size: 12px; color: var(--text); background: var(--card); border: 1px solid var(--line);
             border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .refresh:disabled { opacity: .5; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px; min-width: 0; }
  .stat .k { font-size: 12px; color: var(--sub); }
  .stat .v { font-size: 15px; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }

  .card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; font-weight: 700; }
  .chart-box { position: relative; height: 220px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--sub); }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .empty { font-size: 13px; color: var(--sub); padding: 24px 0; text-align: center; }

  ul { list-style: none; margin: 0; padding: 0; }
  .pos { padding: 12px 0; border-top: 1px solid var(--line); }
  .pos:first-child { border-top: 0; padding-top: 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
  .name { font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
  .tag { font-size: 11px; color: var(--sub); margin-left: 6px; font-weight: 500; }
  .small { font-size: 12px; color: var(--sub); margin-top: 3px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); opacity: .35; }

  .trade { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .trade:first-child { border-top: 0; padding-top: 0; }
  footer { font-size: 12px; color: var(--sub); text-align: center; margin-top: 20px; line-height: 1.6; }
  .error { background: var(--card); border-radius: 14px; padding: 16px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="label">총자산 (가상 계좌)</div>
    <div id="total" class="total num">불러오는 중…</div>
    <div id="change" class="change num"></div>
    <div id="principal" class="small num"></div>
    <div class="meta"><span id="strategy"></span><span>·</span><span id="updated"></span>
      <button id="refresh" class="refresh" type="button">↻ 새로고침</button></div>
  </header>

  <section class="stats">
    <div class="stat"><div class="k">현금</div><div id="cash" class="v num">-</div></div>
    <div class="stat"><div class="k">보유 종목</div><div id="count" class="v num">-</div></div>
    <div class="stat"><div class="k">다음 교체</div><div id="next" class="v">-</div></div>
  </section>

  <section class="card">
    <h2>자산 변화</h2>
    <div class="chart-box"><canvas id="chart" aria-label="자산 변화 그래프"></canvas></div>
    <div id="chart-empty" class="empty" hidden>매일 아침 기록이 쌓이면 그래프가 그려져요.</div>
    <div class="legend">
      <span><i style="background:var(--up)"></i>내 계좌</span>
      <span><i style="background:var(--bench1)"></i>코스피</span>
      <span><i style="background:var(--bench2)"></i>S&amp;P500</span>
      <span>· 쉬는 날은 전날 금액으로 이어요</span>
    </div>
  </section>

  <section class="card">
    <h2>보유 종목</h2>
    <ul id="positions"></ul>
  </section>

  <section class="card">
    <h2>최근 거래</h2>
    <ul id="trades"></ul>
  </section>

  <footer>
    가상 계좌예요. 실제 돈이 아니에요.<br>
    평일 9시 5분(장 시작)과 15시 40분(장 마감)에 업데이트돼요.
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  const won = n => Math.round(n).toLocaleString("ko-KR") + "원";
  const pct = n => (n > 0 ? "+" : "") + n.toFixed(2) + "%";
  const tone = n => n > 0 ? "up" : n < 0 ? "down" : "flat";
  const arrow = n => n > 0 ? "▲" : n < 0 ? "▼" : "-";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const $ = id => document.getElementById(id);

  function render(d) {
    const principal = d.principal ?? d.start_cash;   // 원금 = 처음 금액 + 매달 입금액
    const profit = d.value - principal;
    $("total").textContent = won(d.value);
    $("change").className = "change num " + tone(profit);
    $("change").textContent = `${arrow(profit)} ${won(Math.abs(profit))} (${pct(d.return_pct)})`;
    $("principal").textContent = `원금 ${won(principal)}` +
      (d.monthly_deposit ? ` · 매달 1일 +${won(d.monthly_deposit)}` : "");
    $("strategy").textContent = d.strategy;
    $("updated").textContent = d.updated + " 기준" + (d.price_status ? ` (${d.price_status})` : "");
    $("cash").textContent = won(d.cash);
    $("count").textContent = d.positions.length + "개";
    $("next").textContent = d.next_rebalance;

    $("positions").innerHTML = d.positions.length ? d.positions.map(p => `
      <li class="pos">
        <div class="row">
          <div class="name">${esc(p.name)}<span class="tag">${esc(p.sector)}</span></div>
          <div class="num ${tone(p.change_pct)}">${pct(p.change_pct)}</div>
        </div>
        <div class="row small num">
          <span>${won(p.value)} · ${p.qty}주</span>
          <span>${won(p.avg_price)} → ${won(p.price)}</span>
        </div>
        <div class="bar"><span style="width:${Math.min(100, p.weight).toFixed(1)}%"></span></div>
      </li>`).join("") : `<li class="empty">보유 종목이 없어요.</li>`;

    $("trades").innerHTML = d.trades.length ? d.trades.map(t => {
      if (t.action.includes("입금")) return `<li class="trade">
        <div class="row"><div>💰 입금</div><div class="small num">${esc(t.date)}</div></div>
        <div class="small">${esc(t.reason)}</div></li>`;
      const sell = t.action.includes("매도");
      const profit = t.profit_pct === "" ? "" :
        ` <span class="num ${tone(+t.profit_pct)}">${pct(+t.profit_pct)}</span>`;
      return `<li class="trade">
        <div class="row">
          <div><span class="${sell ? "down" : "up"}">${sell ? "매도" : "매수"}</span> ${esc(t.name)}${profit}</div>
          <div class="small num">${esc(t.date)}</div>
        </div>
        <div class="small">${esc(t.reason)}</div>
      </li>`;
    }).join("") : `<li class="empty">아직 거래가 없어요.</li>`;

    drawChart(d);
  }

  // 날짜를 한국 시간 기준 "2026-10-09" 모양으로 (toISOString 은 세계 표준시라 하루가 밀려요)
  const dayKey = t => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
  const parseDay = s => new Date(s + "T00:00:00");

  let chart = null;
  function drawChart(d) {
    if (chart) { chart.destroy(); chart = null; }   // 새로고침할 때 예전 그래프 지우기

    // 장 마감 전이면 오늘 장중 자산을 오늘 점으로 써요. (15:40 마감 업데이트 때 종가로 바뀌어요)
    const history = [...d.history];
    if (d.live && !history.some(h => h.date === d.live.date)) history.push(d.live);

    // 기록 시작일부터 오늘까지 모든 날짜를 만들어요. (주말·공휴일 포함)
    const days = [];
    if (history.length) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const lastRecord = parseDay(history[history.length - 1].date);
      const end = today > lastRecord ? today : lastRecord;
      for (let t = parseDay(history[0].date); t <= end; t.setDate(t.getDate() + 1)) days.push(new Date(t));
    }

    const ok = days.length >= 2 && window.Chart;
    $("chart").parentElement.hidden = !ok;
    $("chart-empty").hidden = ok;
    $("chart-empty").textContent = !window.Chart
      ? "그래프 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."
      : "매일 아침 기록이 쌓이면 그래프가 그려져요.";
    if (!ok) return;

    // 장이 쉬는 날은 기록이 없어서, 전날 금액을 그대로 이어서 그려요.
    const fill = series => {
      const map = Object.fromEntries(series.map(s => [s.date, s.value]));
      let last = null;
      return days.map(t => (last = map[dayKey(t)] ?? last));
    };
    const holidays = d.holidays || {};
    const labels = days.map(t => {
      const md = `${t.getMonth() + 1}/${t.getDate()}`;
      return holidays[dayKey(t)] ? [md, "(공휴일)"] : md;   // 공휴일은 아래에 (공휴일)
    });
    const dayColor = i => {
      const t = days[i];
      if (!t) return css("--sub");
      if (holidays[dayKey(t)] || t.getDay() === 0) return css("--up");   // 일요일·공휴일: 빨강
      if (t.getDay() === 6) return css("--down");                        // 토요일: 파랑
      return css("--sub");
    };

    const line = (data, color, width, dash) => ({
      data, borderColor: color, borderWidth: width, borderDash: dash || [],
      pointRadius: 0, tension: 0.25, spanGaps: true,
    });
    chart = new Chart($("chart"), {
      type: "line",
      data: { labels, datasets: [
        line(fill(history), css("--up"), 2.5),
        line(fill(d.benchmarks.kospi), css("--bench1"), 1.5),
        line(fill(d.benchmarks.sp500), css("--bench2"), 1.5, [4, 4]),
      ]},
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => c.raw == null ? "" :
            ["내 계좌", "코스피", "S&P500"][c.datasetIndex] + " " + won(c.raw) } } },
        scales: {
          x: { grid: { display: false },
               ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 7, font: { weight: "600" },
                        color: c => dayColor(c.tick.value) } },   // 토요일 파랑, 일요일·공휴일 빨강
          y: { grid: { color: css("--line") }, ticks: { color: css("--sub"),
               callback: v => (v / 10000).toLocaleString("ko-KR") + "만" } },
        },
      },
    });
  }

  // 최신 데이터 가져오기: 앱을 열 때, 다시 화면으로 돌아올 때, 새로고침 버튼을 누를 때
  function load() {
    $("refresh").disabled = true;
    document.querySelector(".error")?.remove();
    fetch("data.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => {
        document.querySelector("main").insertAdjacentHTML("afterbegin",
          `<div class="error">계좌 데이터를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>`);
      })
      .finally(() => { $("refresh").disabled = false; });
  }
  $("refresh").addEventListener("click", load);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") load();
  });
  load();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
